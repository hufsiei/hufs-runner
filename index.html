   『삼국지연의』의 전통적 묘사(관우의 붉은 얼굴·긴 수염 등)만 참고함.

/* ---------------- 소리 ---------------- */
let AC=null,noiseBuf=null,muted=false;
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate|0,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}
}
function sfx(k){
  if(!AC||muted)return;const n=AC.currentTime;
  const tone=(f0,f1,dur,type,vol)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+dur+.02)};
  const noise=(fr,dur,vol,q=1)=>{const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=fr;f.Q.value=q;g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(f).connect(g).connect(AC.destination);s.start(n);s.stop(n+dur+.02)};
  switch(k){
    case'whoosh':noise(2400,.1,.1,2);break;
    case'hit':tone(260,70,.1,'square',.08);noise(2600,.08,.3,2);break;
    case'heavy':tone(150,40,.25,'sine',.45);noise(900,.18,.42);break;
    case'block':tone(1800,1500,.09,'triangle',.12);noise(5200,.06,.18,4);break;
    case'super':tone(160,700,.45,'sawtooth',.1);noise(1400,.4,.15,.5);break;
    case'ko':tone(300,40,.9,'sawtooth',.18);noise(500,.7,.4);break;
    case'throw':noise(3400,.12,.12);break;
    case'ui':tone(520,780,.08,'triangle',.12);break;
    case'gong':tone(180,172,1.4,'sine',.3);tone(272,266,1.1,'sine',.12);noise(300,.4,.12,.5);break;
    case'roar':tone(110,60,.7,'sawtooth',.25);noise(400,.6,.35,.6);break;
  }
}

/* ---------------- 입력 ---------------- */
const MAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyW:'up',KeyA:'a',KeyS:'s',KeyD:'d',KeyJ:'a',KeyK:'s',KeyL:'d',Enter:'ok',Space:'ok',Escape:'esc',KeyQ:'q',KeyM:'m'};
const keys={},pressed={};
addEventListener('keydown',e=>{const k=MAP[e.code];if(!k)return;e.preventDefault();ensureAudio();if(!keys[k])pressed[k]=true;keys[k]=true});

addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

];
const DIFFS=[{name:'쉬움',think:[.6,1.05],block:.1,chain:.15,spc:.35,dmg:.85},{name:'보통',think:[.38,.75],block:.25,chain:.45,spc:.6,dmg:1},{name:'어려움',think:[.2,.45],block:.42,chain:.8,spc:.85,dmg:1.1}];
const FIELDS=[{name:'호뢰관',hanja:'虎牢關'},{name:'장판교',hanja:'長坂橋'},{name:'적벽',hanja:'赤壁'},{name:'무작위',hanja:'?'}];

/* ---------------- 상태 ---------------- */
let scene='title',sceneT=0,P1=null,CPU=null,projs=[],fx=[],pops=[];
let flashC='#fff',flashT=0,superWho=null,hitstop=0,superT=0,superText='',superSub='',superSide=1,slowmo=0,shake=0,roundT=ROUND_TIME,readyT=0,koT=0,koWho=null,timeUp=false,paused=false;
let selStep=0,cur=[0,5],chosen=[0,5],optRow=0,diff=1,field=3,fieldNow=0,wins=[0,0],roundNo=0,streak=0,matchWinner=null;
let stats={maxCombo:0};
const NONE={mx:0,jump:false,block:false,atk:null};
function makeF(def,x,facing,cpu){return{def,cpu,x,y:GROUND,vx:0,vy:0,facing,onGround:true,hp:def.hp,maxHp:def.hp,dhp:def.hp,meter:0,
  state:'idle',t:0,mv:null,mk:null,mt:0,hitN:0,lastHit:-9,connected:false,chain:0,kdFlag:false,inv:0,bs:0,buf:null,combo:0,comboT:0,
  anim:rnd(0,3),flashT:0,airUsed:false,timeMul:def.tm||1,projDone:false,fxDone:false,aiChained:false,alt:false,ai:{plan:'wait',pt:1}}}

/* ---------------- 커맨드 입력 ---------------- */
const CANCEL=['pole','slide','tKnife','tWave','tArrow','flurry','special'];
let hist=[],gClock=0,pendAtk=null,pendT=0;
function pushDir(d){hist.push({d,t:gClock});if(hist.length>12)hist.shift()}
function matchCmd(seq,win){if(hist.length<seq.length)return false;const tl=hist.slice(-seq.length);
  for(let i=0;i<seq.length;i++)if(tl[i].d!==seq[i])return false;return gClock-tl[0].t<=win&&gClock-tl[tl.length-1].t<=.4}
function cmdFor(b){
  if(b==='d'&&matchCmd(['B','D','F','D','B'],1.6))return'special';
  if(b==='d'&&matchCmd(['F','D','B','D','F'],1.6))return'flurry';
  if(matchCmd(['D','F'],.5))return{a:'tKnife',s:'tWave',d:'tArrow'}[b];
  if(b==='a'&&matchCmd(['D','B'],.5))return'slide';
  return{a:'light',s:'heavy',d:'pole'}[b];
}
function readInput(){
  const fw=P1.facing>0;
  if(pressed.left)pushDir(fw?'B':'F');if(pressed.right)pushDir(fw?'F':'B');if(pressed.down)pushDir('D');
  const b=pressed.a?'a':pressed.s?'s':pressed.d?'d':null;
  if(b){const c=cmdFor(b);if(CANCEL.includes(c))hist=[];pendAtk=c;pendT=.25}
}

/* ---------------- 효과 ---------------- */
function sparks(x,y,c,n,spd=380){for(let i=0;i<n;i++){if(fx.length>700)fx.shift();const a=rnd(0,Math.PI*2),s=rnd(.3,1)*spd;fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:rnd(.25,.55),max:.55,c,r:rnd(2,4.5)})}}
function impact(x,y,c,big){fx.push({k:'star',x,y,life:.2,max:.2,c,big})}
function dust(x){for(let i=0;i<10;i++)fx.push({k:'p',x:x+rnd(-30,30),y:GROUND-4,vx:rnd(-160,160),vy:rnd(-160,-40),life:rnd(.3,.6),max:.6,c:'#cbb48f',r:rnd(3,6)})}
function ring(x,y,c,max){fx.push({k:'ring',x,y,c,life:.55,max:.55,R:max})}
function pop(x,y,s,c,size=20,life=.8){pops.push({x,y,s,c,size,life,max:life})}

/* ---------------- 판정 ---------------- */
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function boxOf(f,b,sym){if(sym)return{x:f.x+b[0],y:f.y+b[1],w:b[2],h:b[3]};return{x:f.facing>0?f.x+b[0]:f.x-b[0]-b[2],y:f.y+b[1],w:b[2],h:b[3]}}
function hurtOf(f){const bw=f.def.bw||22,bh=f.def.bh||118;
  if(f.state==='atk'&&f.mk==='slide')return{x:f.x-bw*1.5,y:f.y-40,w:bw*3,h:40};
  if(f.state==='down'||f.state==='ko')return{x:f.x-bh/2,y:f.y-30,w:bh,h:30};return{x:f.x-bw,y:f.y-bh,w:bw*2,h:bh}}
const pbox=p=>({x:p.x-p.w/2,y:p.y-p.h/2,w:p.w,h:p.h});
const foe=f=>f===P1?CPU:P1;

function applyHit(att,df,mv,dir,isProj){
  if(df.inv>0||df.state==='down'||df.state==='ko')return false;
  const bh=118,hx=df.x-dir*10,hy=df.y-bh*.6;
  if(df.state==='block'&&df.facing===-dir&&!mv.unblock){
    df.hp=Math.max(1,df.hp-mv.dmg*.15);df.vx=dir*200;df.bs=.18;hitstop=.05;
    sparks(hx,hy,'#ffe9a8',10,300);impact(hx,hy,'#ffe9a8',false);sfx('block');
    df.meter=Math.min(100,df.meter+4);att.meter=Math.min(100,att.meter+2);
    pop(df.x,df.y-bh-14,'막기!','#ffe9a8',18,.5);return true;
  }
  const kd=mv.kd||(!isProj&&att.kdFlag);
  let dmg=mv.dmg*(att.def.power||1);if(att.cpu)dmg*=DIFFS[diff].dmg;dmg=Math.max(1,Math.round(dmg));
  df.hp-=dmg;df.flashT=.09;
  att.combo=att.comboT>0?att.combo+1:1;att.comboT=1.1;
  if(att===P1)stats.maxCombo=Math.max(stats.maxCombo,att.combo);
  att.meter=Math.min(100,att.meter+dmg*1.6);df.meter=Math.min(100,df.meter+dmg*1.1);
  if(df.state==='atk'){df.mv=null;df.mk=null}
  if(df.hp<=0){df.hp=0;df.state='ko';df.vy=-560;df.vx=dir*320;df.onGround=false;KO(df)}
  else if(kd||!df.onGround){df.state='down';df.t=.85;df.vy=-460;df.vx=dir*(mv.kb||300);df.onGround=false}
  else{df.state='stun';df.t=mv.hs||.3;df.vx=dir*(mv.kb||150)}
  hitstop=kd?.13:.07;shake=Math.min(16,shake+(kd?10:5));
  sparks(hx,hy,kd?'#ffd166':'#ffffff',kd?24:12);impact(hx,hy,kd?'#ffd166':'#ffffff',kd);
  for(let i=0;i<5;i++)fx.push({k:'p',x:hx,y:hy,vx:rnd(-250,250),vy:rnd(-300,0),life:rnd(.2,.4),max:.4,c:'#a3221a',r:rnd(2,3.5)});
  pop(hx+rnd(-10,10),hy-30,String(dmg),att===P1?'#ffe08a':'#ff9a8a',kd?28:22,.6);
  sfx(kd||dmg>=10?'heavy':'hit');
  return true;
}
function KO(df){koWho=df;koT=2.4;slowmo=1.1;projs=[];sfx('ko');shake=20}

/* ---------------- 동작 ---------------- */
function specialFx(f,mv){
  if(mv.flash){flashC=mv.flash;flashT=.35}
  if(mv.fx==='roar'){sfx('roar');for(let i=0;i<3;i++)setTimeout(()=>ring(f.x,f.y-70,'#ffe9a8',250),i*90);shake=22;

function aiIntent(b,p,dt){

  txt('제'+Math.min(roundNo,3)+'합',VW/2,80,14,GOLD,'center',900,3,SERIF);
  meterBar(28,200,P1,false);meterBar(VW-228,200,CPU,true);
  if(P1.meter>=100)txt('필살기 가능!',236,81,12,'#ffd166','left',900,3);
  if(P1.combo>=2)txt(P1.combo+' 연격!',60,170,30+Math.min(P1.combo,10),'#ffd166','left',900,6);
  if(CPU.combo>=2)txt(CPU.combo+' 연격!',VW-60,170,30+Math.min(CPU.combo,10),'#ff9a8a','right',900,6);
  ctx.globalAlpha=.8;txt('A 베기  S 내려찍기  D 찌르기 · ↓뒤+A 발걸기 · ↓앞+A/S/D 원거리 · 앞↓뒤↓앞+D 연참 · 뒤↓앞↓뒤+D 필살기 · Esc 기술표',VW/2,VH-14,12,'#fff','center',700,3);ctx.globalAlpha=1;
}

/* ---------------- 장면 그리기 ---------------- */
function drawFX(){
  for(const p of fx){const a=p.life/p.max;
    if(p.k==='p'){ctx.globalAlpha=Math.min(1,a*1.5);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
    else if(p.k==='ring'){ctx.globalAlpha=a;ctx.strokeStyle=p.c;ctx.lineWidth=8*a+1;ctx.beginPath();ctx.arc(p.x,p.y,20+p.R*(1-a),0,7);ctx.stroke()}
    else if(p.k==='ghost'){ctx.globalAlpha=a*.32;ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.f.facing,1);drawWarrior(p.f.def.look,p.P,p.f.anim);ctx.restore();ctx.globalAlpha=a*.18;ctx.fillStyle=GHOSTC[p.tint]||'#fff';ctx.beginPath();ctx.ellipse(p.x,p.y-64,20,56,0,0,7);ctx.fill()}
    else if(p.k==='horse')drawHorse(p,a);
    else if(p.k==='whirl'){const f=p.f,ang=sceneT*20;ctx.save();ctx.translate(f.x,f.y-74);ctx.globalAlpha=Math.min(1,a*3)*.85;
      for(let i=0;i<3;i++){ctx.strokeStyle=['#d62f2f','#ffb199','#8b1e1e'][i];ctx.lineWidth=13-i*3;ctx.lineCap='round';ctx.beginPath();ctx.ellipse(0,0,135-i*16,62-i*9,0,ang+i*2.1,ang+i*2.1+2.3);ctx.stroke()}ctx.restore()}
    else if(p.k==='up'){const k=1-a;ctx.globalAlpha=a;ctx.save();ctx.translate(p.x,p.y-k*560);ctx.shadowColor='#ffd166';ctx.shadowBlur=16;ctx.strokeStyle='#ffe9a8';ctx.lineWidth=3;line(0,0,0,34);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(0,-12);ctx.lineTo(6,0);ctx.fill();ctx.restore()}
    else if(p.k==='streak'){ctx.globalAlpha=a;ctx.strokeStyle='#cfe6ff';ctx.lineWidth=3;line(p.x-p.dir*70*(1-a),p.y,p.x+p.dir*40,p.y);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x+p.dir*40,p.y,3,0,7);ctx.fill()}
    else{const k=1-a,R0=p.big?70:42;ctx.globalAlpha=a;ctx.strokeStyle=p.c;ctx.lineWidth=p.big?5:3.5;ctx.beginPath();
      for(let i=0;i<10;i++){const an=i*Math.PI/5+(p.big?.2:0),r1=R0*k*.4,r2=R0*(.4+k*.8)*(i%2?.6:1);ctx.moveTo(p.x+Math.cos(an)*r1,p.y+Math.sin(an)*r1);ctx.lineTo(p.x+Math.cos(an)*r2,p.y+Math.sin(an)*r2)}ctx.stroke()}
  }
  ctx.globalAlpha=1;
  for(const s of pops){ctx.globalAlpha=Math.min(1,s.life/s.max*2.5);txt(s.s,s.x,s.y,s.size,s.c,'center',900,Math.max(4,s.size/4))}
  ctx.globalAlpha=1;
}
const GHOSTC={blue:'#7fb6ff',teal:'#6fe0cf',red:'#ff6a5a'};
const TINT={blue:'brightness(1.3) sepia(1) hue-rotate(180deg) saturate(4)',teal:'brightness(1.2) sepia(1) hue-rotate(120deg) saturate(3)',red:'brightness(1.15) sepia(1) hue-rotate(-35deg) saturate(5)'};
function drawHorse(p,a){
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.dir,1);ctx.globalAlpha=Math.min(1,a*2)*.55;ctx.fillStyle='#8fe8d8';ctx.strokeStyle='#8fe8d8';
  const g=Math.sin((1-a)*42+p.ph*2)*.7;
  ctx.beginPath();ctx.ellipse(0,-64,46,19,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(26,-74);ctx.lineTo(48,-114);ctx.lineTo(66,-106);ctx.lineTo(44,-60);ctx.fill();
  ctx.beginPath();ctx.ellipse(64,-104,16,8,.5,0,7);ctx.fill();
  ctx.lineWidth=7;ctx.lineCap='round';for(const [x,q] of[[-32,0],[-20,1],[22,1],[34,0]]){const an=q?g:-g;line(x,-52,x+Math.sin(an)*26,-52+Math.cos(an)*46)}
  ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-44,-68);ctx.quadraticCurveTo(-66,-72,-72,-44);ctx.stroke();
  ctx.beginPath();ctx.ellipse(4,-98,10,18,.2,0,7);ctx.fill();ctx.beginPath();ctx.arc(8,-122,8,0,7);ctx.fill();ctx.lineWidth=3;line(-24,-112,74,-120);
  ctx.restore();
}
const MOVELIST=[['← →  /  ↑  /  ↓','이동  /  점프  /  막기'],['A','베기'],['S','내려찍기'],['D','찌르기 (긴 사거리)'],
  ['A  A  S','연격 (맞힌 뒤 아래 커맨드 기술로 이어 치기 가능)'],['↓  뒤  +  A','발걸기 (상대가 넘어짐, 낮은 자세)'],
  ['↓  앞  +  A','비도 던지기 (빠름)'],['↓  앞  +  S','검기 날리기 (바닥을 따라감, 점프로 피함)'],['↓  앞  +  D','화살 쏘기'],
  ['앞  ↓  뒤  ↓  앞  +  D','연참 (기력 없이 사용, 4연속 베기)'],['뒤  ↓  앞  ↓  뒤  +  D','필살기 (기력 100 필요)'],['공중에서 A·S·D','공중 베기']];
function panel(x,y,w,h){ctx.fillStyle='rgba(28,16,10,.92)';rr(x,y,w,h,10);ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='rgba(226,179,60,.35)';ctx.lineWidth=1;rr(x+6,y+6,w-12,h-12,6);ctx.stroke()}
function drawMoveList(){
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,VW,VH);panel(VW/2-330,40,660,440);
  txt('기술표 (일시정지)',VW/2,78,28,GOLD,'center',900,0,SERIF);
  MOVELIST.forEach(([k,d],i)=>{const y=114+i*25;txt(k,VW/2-110,y,16,'#ffd98a','right',900);txt(d,VW/2-80,y,15,'#fff','left',700)});
  txt(P1.def.name+' 필살기: '+P1.def.moves.special.name+' — '+P1.def.spDesc,VW/2,114+MOVELIST.length*25+2,13,'#e8c9a0','center',700);
  txt('앞 = 상대 쪽, 뒤 = 반대쪽   ·   Esc: 계속   Q: 장수 선택으로',VW/2,452,15,GOLD,'center',800);
}
function drawFight(){
  ctx.save();if(shake)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBG(fieldNow);
  if(superT>0){ctx.fillStyle='rgba(10,5,5,.62)';ctx.fillRect(0,0,VW,VH)}
  const order=CPU.state==='atk'&&P1.state!=='atk'?[P1,CPU]:[CPU,P1];
  for(const f of order)drawFighter(f);
  for(const p of projs)drawProj(p);
  drawFX();
  ctx.restore();
  drawHUD();
  if(superT>0){
    const k=1-superT/.6,x0=superSide>0?-300:300;ctx.fillStyle='rgba(20,5,5,.75)';ctx.beginPath();ctx.moveTo(0,186);ctx.lineTo(VW,166);ctx.lineTo(VW,280);ctx.lineTo(0,300);ctx.fill();
    ctx.fillStyle=superSide>0?GOLD:'#d62f2f';ctx.fillRect(0,182,VW,4);ctx.fillRect(0,296,VW,4);
    const dx=(1-Math.min(1,k*3))*x0;
    if(superWho){ctx.save();ctx.beginPath();ctx.moveTo(0,186);ctx.lineTo(VW,166);ctx.lineTo(VW,280);ctx.lineTo(0,300);ctx.clip();
      const px=superSide>0?150:VW-150;ctx.translate(px+dx*.7,500);ctx.scale(2.7*superSide,2.7);
      if(superWho.alt)ctx.filter='hue-rotate(150deg) saturate(.8)';drawWarrior(superWho.def.look,Object.assign(poseOf(superWho),{face:'yell',lean:0}),superWho.anim);ctx.restore();ctx.filter='none'}
    txt('('+superSub+')',VW/2+dx,272,18,'rgba(255,233,168,.8)','center',700,0,SERIF);
    txt(superText,VW/2+dx,226,58,superSide>0?'#ffd166':'#ff8a7a','center',900,10,SERIF);
  }
  if(readyT>0)txt(readyT>.8?'제'+Math.min(roundNo,3)+'합':'승부!',VW/2,VH/2-30,readyT>.8?78:90,readyT>.8?'#fff':'#ffd166','center',900,12,SERIF);
  if(koT>0)txt(timeUp?'시간 종료':'격파!',VW/2,VH/2-40,96,'#ff5a4a','center',900,14,SERIF);
  if(flashT>0){ctx.globalAlpha=Math.min(1,flashT/.35)*.45;ctx.fillStyle=flashC;ctx.fillRect(0,0,VW,VH);ctx.globalAlpha=1}
  if(paused)drawMoveList();
}
const blink=()=>Math.floor(sceneT*2.2)%2===0;
const demo=CHARS.map(c=>makeF(c,0,1,false));
function drawTitle(){
  drawBG(2);ctx.fillStyle='rgba(10,5,10,.45)';ctx.fillRect(0,0,VW,VH);
  txt('삼국 일기토',VW/2,140,96,GOLD,'center',900,14,SERIF);
  txt('천하의 명장, 단 한 판의 승부',VW/2,226,17,'#f0d8b0','center',700,5);
  demo.forEach((f,i)=>{f.anim+=1/60;f.state=i===5?'win':'idle';f.x=VW/2+(i-2.5)*140;f.y=GROUND;f.facing=i<3?1:-1;drawFighter(f)});
  if(blink())txt('Enter 또는 클릭으로 시작',VW/2,296,24,'#fff','center',900,6);
  txt('인물 그림은 『삼국지연의』의 전통적 묘사를 바탕으로 새로 그린 창작물입니다',VW/2,VH-14,11,'rgba(255,255,255,.55)','center',600);
}
const CARD_X=i=>90+i*156,CARD_Y=74,CARD_W=140,CARD_H=226;
function drawSelect(){
  drawBG(0);ctx.fillStyle='rgba(15,8,5,.72)';ctx.fillRect(0,0,VW,VH);
  const head=['1P 장수를 고르세요','상대(CPU) 장수를 고르세요','대결 설정'][selStep];
  txt(head,VW/2,38,30,selStep===1?'#ff9a8a':GOLD,'center',900,6,SERIF);
  const hi=selStep<2?cur[selStep]:chosen[0];
  CHARS.forEach((c,i)=>{
    const cx=CARD_X(i),x=cx-CARD_W/2,on=selStep<2&&i===cur[selStep];
    ctx.fillStyle=on?'rgba(70,40,24,.95)':'rgba(40,24,16,.88)';rr(x,CARD_Y,CARD_W,CARD_H,10);ctx.fill();
    ctx.strokeStyle=on?(selStep===1?'#ff6a5a':GOLD):'rgba(226,179,60,.3)';ctx.lineWidth=on?4:2;ctx.stroke();
    const f=demo[i];f.anim+=1/60/6;f.state=on?'win':'idle';
    ctx.save();ctx.beginPath();ctx.rect(x+3,CARD_Y+3,CARD_W-6,CARD_H-6);ctx.clip();ctx.translate(cx,CARD_Y+205);ctx.scale(.95,.95);drawWarrior(c.look,poseOf(f),f.anim);ctx.restore();
    txt(c.name,cx,CARD_Y+CARD_H+18,20,'#fff','center',900,4);txt('('+c.hanja+')',cx,CARD_Y+CARD_H+40,14,'#d9c49a','center',700,3,SERIF);
    if(selStep>=1&&i===chosen[0]){ctx.fillStyle='#2f6fd6';rr(x+6,CARD_Y+6,34,20,4);ctx.fill();txt('1P',x+23,CARD_Y+16,12,'#fff')}
    if(selStep>=2&&i===chosen[1]){ctx.fillStyle='#c0392b';rr(x+CARD_W-46,CARD_Y+6,40,20,4);ctx.fill();txt('CPU',x+CARD_W-26,CARD_Y+16,12,'#fff')}
  });
  if(selStep<2){
    const c=CHARS[hi];panel(40,354,880,128);
    txt(c.name+' ('+c.hanja+')',64,382,28,GOLD,'left',900,0,SERIF);txt('자 '+c.ja+'  ·  '+c.type+'  ·  '+c.weapon,64,414,14,'#e8d6b0','left',700);
    ['체력','속도','공격'].forEach((n,j)=>{const yy=440+j*0;const xx=64+j*130;txt(n,xx,yy+6,13,'#ccb','left',700);for(let k=0;k<5;k++){ctx.fillStyle=k<c.stats[j]?GOLD:'#4a3a2a';ctx.fillRect(xx+34+k*16,yy,12,12)}});
    c.desc.forEach((d,j)=>txt(d,470,384+j*22,15,'#fff','left',700));
    txt('필살기  '+c.moves.special.name+' ('+c.moves.special.hanja+')',470,432,16,'#ffd166','left',900);
    txt(c.spDesc,470,456,13,'#e8c9a0','left',600);
    txt('← → 선택   Enter 결정   Esc 뒤로   (클릭: 선택, 한 번 더 클릭하면 결정)',VW/2,VH-16,13,'#fff','center',700,3);
  }else{
    panel(VW/2-300,350,600,150);
    const rows=[['난이도',DIFFS.map(d=>d.name),diff],['전장',FIELDS.map(f=>f.name),field]];
    rows.forEach(([lab,opts,val],r)=>{const y=384+r*42;txt(lab,VW/2-250,y,18,optRow===r?GOLD:'#ccb','left',900);
      opts.forEach((o,j)=>{const ox=VW/2-130+j*100,on=j===val;ctx.fillStyle=on?(optRow===r?'#8b1e1e':'#5a2a1e'):'rgba(255,255,255,.06)';rr(ox-44,y-15,88,30,6);ctx.fill();
        if(on){ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.stroke()}txt(o,ox,y,15,on?'#fff':'#bba','center',800)})});
    txt('↑↓ 항목   ← → 변경   Enter 출진!   Esc 뒤로',VW/2,476,14,'#fff','center',700);
  }
}
function drawVS(){
  drawBG(field===3?0:field);ctx.fillStyle='rgba(10,5,5,.7)';ctx.fillRect(0,0,VW,VH);
  const k=Math.min(1,sceneT*2.5),a=CHARS[chosen[0]],b=CHARS[chosen[1]];
  const pf=demo[chosen[0]];pf.anim+=1/60;pf.state='idle';
  ctx.save();ctx.translate(250-(1-k)*220,420);ctx.scale(1.6,1.6);drawWarrior(a.look,poseOf(pf),pf.anim);ctx.restore();
  const bf=demo[chosen[1]];
  ctx.save();if(chosen[0]===chosen[1])ctx.filter='hue-rotate(150deg) saturate(.8)';ctx.translate(710+(1-k)*220,420);ctx.scale(-1.6,1.6);drawWarrior(b.look,poseOf(bf),bf.anim+1);ctx.restore();ctx.filter='none';
  txt('VS',VW/2,230,84,GOLD,'center',900,12,SERIF);
  txt(a.name,250,462,28,'#fff','center',900,6,SERIF);txt(b.name,710,462,28,'#ff9a8a','center',900,6,SERIF);
  const fd=field===3?'전장 무작위':FIELDS[field].name;
  txt(fd+'   ·   난이도 '+DIFFS[diff].name+'   ·   2선승',VW/2,60,18,'#f0d8b0','center',800,5);
  txt('전투 중 Esc를 누르면 기술표를 볼 수 있습니다',VW/2,508,14,'#ffd166','center',700,4);
}
function drawResult(){
  drawFight();ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,VW,VH);
  panel(VW/2-270,140,540,240);
  const win=matchWinner===0;
  txt(win?'승리':'패배',VW/2,192,56,win?GOLD:'#ff6a5a','center',900,8,SERIF);
  txt((win?P1:CPU).def.name+', 일기토에서 승리하다',VW/2,248,19,'#fff','center',800);
  txt('합 전적 '+wins[0]+' : '+wins[1]+'   ·   최대 연격 '+stats.maxCombo+'   ·   연승 '+streak,VW/2,284,16,'#e8d6b0','center',700);
  if(blink())txt('Enter: 다시 대결   ·   Esc: 장수 선택',VW/2,338,18,'#ffd98a','center',800);
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0d0907';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
  switch(scene){case'title':drawTitle();break;case'select':drawSelect();break;case'vs':drawVS();break;case'fight':drawFight();break;case'result':drawResult();break}
  ctx.restore();
}

/* ---------------- 클릭 ---------------- */
cv.addEventListener('pointerdown',e=>{
  ensureAudio();const x=(e.clientX-OX)/SC,y=(e.clientY-OY)/SC;
  if(scene==='title'){go('select');selStep=0;sfx('ui')}
  else if(scene==='select'){
    if(selStep<2){for(let i=0;i<6;i++)if(Math.abs(x-CARD_X(i))<CARD_W/2&&y>CARD_Y&&y<CARD_Y+CARD_H+50){if(i===cur[selStep])confirmPick();else{cur[selStep]=i;sfx('ui')}}}
    else{
      for(let r=0;r<2;r++){const yy=384+r*42;if(Math.abs(y-yy)<16){const n=r===0?3:4;for(let j=0;j<n;j++){const ox=VW/2-130+j*100;if(Math.abs(x-ox)<44){optRow=r;if(r===0)diff=j;else field=j;sfx('ui')}}}}
      if(y>462&&y<492){go('vs');sfx('gong')}
    }
  }
  else if(scene==='vs'&&sceneT>.4)startMatch();
  else if(scene==='result'&&sceneT>.8){go('vs');sfx('ui')}
});

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();for(const k in pressed)pressed[k]=false;requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
